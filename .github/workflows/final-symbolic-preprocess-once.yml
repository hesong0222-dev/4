name: Final symbolic MIDI preprocessing once

on:
  push:
    branches: [data/final-symbolic-preprocess-20260828]
    paths:
      - .github/workflows/final-symbolic-preprocess-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-symbolic-preprocess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Restore validated preprocessing scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-preprocess
          base64 --decode tools/final_preprocess/build_pdmx_midi_event_manifest.py.gz.b64 \
            | gzip --decompress > /tmp/final-preprocess/build_pdmx_midi_event_manifest.py
          base64 --decode tools/final_preprocess/finalize_training_ready_v2.py.gz.b64 \
            | gzip --decompress > /tmp/final-preprocess/finalize_training_ready_v2.py
          python3 -m py_compile /tmp/final-preprocess/*.py

      - name: Install minimal MIDI parser dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'mido==1.3.3'

      - name: Synthetic parser smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/midi-event-smoke
          mkdir -p /tmp/midi-event-smoke/records/records /tmp/midi-event-smoke/midi/mid/a
          python3 - <<'PY'
          import csv,gzip
          from pathlib import Path
          import mido
          base=Path('/tmp/midi-event-smoke')
          mid=mido.MidiFile(ticks_per_beat=480)
          tr=mido.MidiTrack();mid.tracks.append(tr)
          tr.append(mido.MetaMessage('track_name',name='Piano',time=0))
          tr.append(mido.MetaMessage('set_tempo',tempo=mido.bpm2tempo(120),time=0))
          tr.append(mido.MetaMessage('time_signature',numerator=3,denominator=4,time=0))
          tr.append(mido.MetaMessage('key_signature',key='C',time=0))
          tr.append(mido.Message('program_change',channel=0,program=0,time=0))
          tr.append(mido.Message('note_on',channel=0,note=60,velocity=80,time=0))
          tr.append(mido.Message('note_off',channel=0,note=60,velocity=0,time=480))
          tr.append(mido.Message('note_on',channel=9,note=36,velocity=100,time=0))
          tr.append(mido.Message('note_off',channel=9,note=36,velocity=0,time=120))
          mid.save(base/'midi/mid/a/x.mid')
          with gzip.open(base/'records/records/part-00001.csv.gz','wt',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['record_id','mid']);w.writeheader();w.writerow({'record_id':'smoke','mid':'./mid/a/x.mid'})
          PY
          python3 /tmp/final-preprocess/build_pdmx_midi_event_manifest.py \
            --records-root /tmp/midi-event-smoke/records \
            --midi-root /tmp/midi-event-smoke/midi \
            --output /tmp/midi-event-smoke/out \
            --expected-records 1 --shard-size 1
          python3 - <<'PY'
          import csv,gzip,json
          with gzip.open('/tmp/midi-event-smoke/out/records/part-00001.csv.gz','rt') as f:
              r=next(csv.DictReader(f))
          assert r['parse_ok']=='1'
          assert r['drum_note_count']=='1'
          assert r['primary_meter']=='3/4'
          assert r['declared_primary_key']=='C'
          assert float(r['tempo_bpm_time_weighted_mean'])==120.0
          s=json.load(open('/tmp/midi-event-smoke/out/summary.json'))
          assert s['rendered_audio_created'] is False
          assert s['validation']['passed'] is True
          PY

      - name: Download pinned official PDMX MIDI archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdmx-midi
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            --output /tmp/pdmx-mid.tar.gz \
            'https://zenodo.org/records/15571083/files/mid.tar.gz?download=1'
          printf '%s  %s\n' \
            'd920a21b2fcd99a56d9c381b39debbb2' '/tmp/pdmx-mid.tar.gz' | md5sum --check -
          tar -xzf /tmp/pdmx-mid.tar.gz -C /tmp/pdmx-midi
          test -d /tmp/pdmx-midi/mid

      - name: Parse all 77,321 strict PDMX MIDI records
        shell: bash
        run: |
          set -euo pipefail
          OUT='data/pdmx-v9-midi-event-manifest'
          rm -rf "$OUT"
          python3 /tmp/final-preprocess/build_pdmx_midi_event_manifest.py \
            --records-root data/pdmx-v9-record-instrument-manifest \
            --midi-root /tmp/pdmx-midi \
            --output "$OUT" \
            --expected-records 77321 \
            --shard-size 20000
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/pdmx-v9-midi-event-manifest/summary.json').read_text())
          assert s['input_records']==77321
          assert s['parsed_ok']==77321
          assert s['parse_failures']==0
          assert s['rendered_audio_created'] is False
          assert s['rendering_prohibited_in_this_workflow'] is True
          assert s['validation']['passed'] is True
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
          (cd "$OUT" && sha256sum --check SHA256SUMS)

      - name: Rebuild leakage-safe training-ready manifest with event evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='data/training-ready/pdmx-synth-v2'
          rm -rf "$OUT"
          python3 /tmp/final-preprocess/finalize_training_ready_v2.py \
            --v1-manifest data/training-ready/pdmx-synth-v1/training_manifest.csv.gz \
            --events-root data/pdmx-v9-midi-event-manifest \
            --repo-root . \
            --output "$OUT" \
            --expected 17599 \
            --dev 100 --sealed 150 --rare 50 --review 500
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/training-ready/pdmx-synth-v2')
          s=json.loads((root/'preprocessing_status.json').read_text())
          c=json.loads((root/'coverage_audit.json').read_text())
          l=json.loads((root/'leakage_audit.json').read_text())
          h=json.loads((root/'RENDERING_HOLD.json').read_text())
          assert s['status']=='TRAINING_READY_SYNTHETIC_SYMBOLIC_PREPROCESS_COMPLETE'
          assert s['input_pairs']==17599
          assert s['pseudo_labels_supervised']==0
          assert s['midi_event_parse_joined']==17599
          assert s['strict_eval_representatives']=={'dev':100,'sealed_test':150,'rare_challenge':50}
          assert s['human_review_queue']==500
          assert s['new_midi_to_audio_rendering_performed'] is False
          assert s['rendering_hold'] is True
          assert c['status']=='PASS_EVENT_LEVEL_SYMBOLIC_PREPROCESS_COMPLETE'
          assert c['rendered_audio_created'] is False
          assert l['status']=='PASS'
          assert all(v==0 for v in l['cross_split_leaks'].values())
          assert h['new_midi_to_audio_rendering_allowed'] is False
          assert h['audio_generation_commands_in_workflow'] is False
          assert s['validation']['passed'] is True
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
          (cd "$OUT" && sha256sum --check SHA256SUMS)

      - name: Persist scripts and verified preprocessing outputs
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/final-preprocess/build_pdmx_midi_event_manifest.py scripts/build_pdmx_midi_event_manifest.py
          cp /tmp/final-preprocess/finalize_training_ready_v2.py scripts/finalize_training_ready_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/build_pdmx_midi_event_manifest.py \
            scripts/finalize_training_ready_v2.py \
            data/pdmx-v9-midi-event-manifest \
            data/training-ready/pdmx-synth-v2
          if git diff --cached --quiet; then
            echo 'Final symbolic preprocessing is already current.'
            exit 0
          fi
          git commit -m 'data: finish event-level symbolic preprocessing [skip ci]'
          git push origin HEAD:data/final-symbolic-preprocess-20260828
