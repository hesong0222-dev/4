name: Calibrate humanization from real MIDI once

on:
  push:
    branches: [data/real-midi-calibration-20260828]
    paths:
      - real-midi-calibration-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-midi-humanization-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install the single MIDI dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'mido==1.3.3'
          base64 --decode tools/calibration/analyze_real_midi_corpora.py.gz.b64 | gzip --decompress > /tmp/analyze_real_midi_corpora.py
          base64 --decode tools/calibration/build_humanization_plan.py.gz.b64 | gzip --decompress > /tmp/build_humanization_plan.py
          python3 -m py_compile /tmp/analyze_real_midi_corpora.py /tmp/build_humanization_plan.py
          python3 /tmp/build_humanization_plan.py --self-test >/tmp/planner-self-test.json

      - name: Acquire pinned MIDI-only source snapshots
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/real-midi-calibration"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          clone_at() {
            local url="$1" sha="$2" dst="$3"
            git init -q "$dst"
            git -C "$dst" remote add origin "$url"
            git -C "$dst" -c protocol.version=2 fetch -q --depth=1 origin "$sha"
            git -C "$dst" checkout -q --detach FETCH_HEAD
            rm -rf "$dst/.git"
          }

          clone_at https://github.com/fosfrancesco/asap-dataset.git \
            afc815c75c42e83a79c03feb6da8a35e77d4c6b8 "$ROOT/asap"
          clone_at https://github.com/music-x-lab/POP909-Dataset.git \
            d83e6edba6872a704f5d3b8b32f5cb540088dae6 "$ROOT/pop909"
          clone_at https://github.com/studioph/international-e-piano-dataset.git \
            daa68906166e37daa32be1e1758a3e1b56e6be00 "$ROOT/e-piano-repo"
          clone_at https://github.com/ryanrudes/game-midis.git \
            84a166099c32d6db101c8bd2f0eccc82c8402ddb "$ROOT/game-midis"

          curl --fail --location --retry 4 --retry-all-errors \
            --output "$ROOT/groove-v1.0.0-midionly.zip" \
            https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip
          echo '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e  '"$ROOT/groove-v1.0.0-midionly.zip" | sha256sum --check
          mkdir -p "$ROOT/gmd"
          unzip -q "$ROOT/groove-v1.0.0-midionly.zip" -d "$ROOT/gmd"

          cat "$ROOT"/e-piano-repo/international-e-piano-midi_2002-2018.tar.gz.parta* \
            > "$ROOT/international-e-piano-midi_2002-2018.tar.gz"
          mkdir -p "$ROOT/e-piano"
          tar -xzf "$ROOT/international-e-piano-midi_2002-2018.tar.gz" -C "$ROOT/e-piano"

          curl --fail --location --retry 4 --retry-all-errors \
            --output "$ROOT/nightingale-sorted.tar.gz" \
            https://codeload.github.com/nightingale-ai/midi-data/tar.gz/6865a563766348272a4004a975a208b0ace5ab54
          mkdir -p "$ROOT/nightingale"
          tar -xzf "$ROOT/nightingale-sorted.tar.gz" -C "$ROOT/nightingale" --strip-components=1
          rm -rf "$ROOT/nightingale/unsorted"

          echo "MIDI source counts before parsing:"
          for d in asap gmd e-piano pop909 nightingale game-midis; do
            printf '%-18s ' "$d"
            find "$ROOT/$d" -type f \( -iname '*.mid' -o -iname '*.midi' \) | wc -l
          done
          du -sh "$ROOT"/* | sort -h

      - name: Build runtime source configuration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/real-midi-calibration"
          cat > "$ROOT/runtime-sources.json" <<JSON
          {
            "sources": [
              {"id":"groove_midi_dataset","root":"$ROOT/gmd","adapter":"gmd","source_grade":"REAL_CAPTURED_MIDI","calibration_scope":"expressive_timing_drums","license":"CC-BY-4.0","rights_status":"CLEAR_WITH_ATTRIBUTION","notes":"Professional human drum performances; official MIDI-only archive."},
              {"id":"asap_performance_midi","root":"$ROOT/asap","adapter":"asap","source_grade":"REAL_CAPTURED_MIDI","calibration_scope":"expressive_timing_piano","license":"CC-BY-NC-SA-4.0","rights_status":"NON_COMMERCIAL","notes":"Performance MIDI only; score MIDI excluded by adapter."},
              {"id":"international_e_piano","root":"$ROOT/e-piano","adapter":"generic","source_grade":"REAL_CAPTURED_MIDI","calibration_scope":"expressive_timing_reference_only","license":"UNKNOWN_FOR_UNDERLYING_MIDI","rights_status":"REFERENCE_ONLY_QUARANTINE","genre":"classical","notes":"Live-performance MIDI mirror; statistics only until rights are verified."},
              {"id":"pop909","root":"$ROOT/pop909/POP909","adapter":"pop909","source_grade":"CANONICAL_REAL_COMPOSITION_MIDI","calibration_scope":"structure_only","license":"REPOSITORY_MIT_DATA_RIGHTS_REVIEW_REQUIRED","rights_status":"STRUCTURAL_REFERENCE","genre":"pop","include_versions":true,"notes":"Arrangement structure and density; not promoted to captured-performance timing."},
              {"id":"nightingale_sorted","root":"$ROOT/nightingale","adapter":"generic","source_grade":"MIDI_CANDIDATE_UNVERIFIED","calibration_scope":"structure_only","license":"NO_COLLECTION_LICENSE","rights_status":"REFERENCE_ONLY_QUARANTINE","genre_from_parent":true,"max_files":50000,"notes":"Deterministic cross-genre 50k sample; structural/fast-passage analysis only."},
              {"id":"game_midis","root":"$ROOT/game-midis","adapter":"generic","source_grade":"MIDI_CANDIDATE_UNVERIFIED","calibration_scope":"structure_only","license":"UNKNOWN","rights_status":"REFERENCE_ONLY_QUARANTINE","genre":"video-game","notes":"Structural and dense-passage reference only."}
            ]
          }
          JSON
          python3 -m json.tool "$ROOT/runtime-sources.json" >/dev/null

      - name: Parse events and calibrate empirical priors
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/real-midi-calibration"
          OUT='data/calibration/real-midi-humanization-v1'
          rm -rf "$OUT"
          python3 /tmp/analyze_real_midi_corpora.py \
            --sources "$ROOT/runtime-sources.json" \
            --output "$OUT" \
            --sample-limit 192 \
            --progress-every 1000 \
            --require-total 52000 \
            --require-expressive 2000
          cp "$OUT/calibrated_policy.json" data/policies/adaptive_humanization_calibration_v1.json

      - name: Validate calibration and planner integration
        shell: bash
        run: |
          set -euo pipefail
          OUT='data/calibration/real-midi-humanization-v1'
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('data/calibration/real-midi-humanization-v1')
          v=json.loads((out/'validation.json').read_text())
          assert v['passed'] is True
          assert v['audio_rendered'] is False
          assert v['render_hold'] is True
          assert v['files_parsed'] >= 52000
          assert v['expressive_files_parsed'] >= 2000
          policy=json.loads(Path('data/policies/adaptive_humanization_calibration_v1.json').read_text())
          assert policy['status']=='EMPIRICAL_V1_RENDER_HOLD'
          assert policy['audio_rendered'] is False
          assert len(policy['level_distribution'])==5
          assert policy['family_strength_priors']
          assert policy['speed_multipliers']
          print(json.dumps(v,indent=2,ensure_ascii=False))
          PY
          (cd "$OUT" && sha256sum --check SHA256SUMS)
          cat >/tmp/planner-input.json <<'JSON'
          {"work_id":"calibration-smoke","arrangement_id":"v1","genre":"funk","ensemble":"band","tracks":[{"id":"kick","family":"drums","role":"kick","peak_notes_per_second":4},{"id":"bass","family":"bass","role":"electric_bass","peak_notes_per_second":9},{"id":"keys","family":"keys","role":"piano","peak_notes_per_second":17}]}
          JSON
          python3 /tmp/build_humanization_plan.py /tmp/planner-input.json -o /tmp/calibrated-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/calibrated-plan.json'))
          assert p['calibration_loaded'] is True
          assert p['calibration_version']=='real-midi-humanization-v1-2026-08-28'
          assert p['render_audio_enabled'] is False
          assert p['clean_tier_constraints']['target_is_original_canonical_midi'] is True
          assert p['tracks'][2]['fast_passage_timing_multiplier'] <= p['tracks'][0]['fast_passage_timing_multiplier']
          print(json.dumps(p,indent=2,ensure_ascii=False))
          PY

      - name: Persist aggregate results only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/analyze_real_midi_corpora.py scripts/analyze_real_midi_corpora.py
          cp /tmp/build_humanization_plan.py scripts/build_humanization_plan.py
          git add data/calibration/real-midi-humanization-v1 \
                  data/policies/adaptive_humanization_calibration_v1.json \
                  scripts/analyze_real_midi_corpora.py \
                  scripts/build_humanization_plan.py
          if git diff --cached --quiet; then
            echo 'Calibration outputs are already current.'
            exit 0
          fi
          git commit -m 'data: calibrate humanization from 50k+ MIDI files [skip ci]'
          git push origin HEAD:data/real-midi-calibration-20260828
